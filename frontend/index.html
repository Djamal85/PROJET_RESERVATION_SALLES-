<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LOGIN</title>
  <!-- Importation de la police Poppins depuis Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
  <style>
    /* Définition des variables CSS pour les couleurs principales */
    :root {
      --background: #1a1a2e;
      --color: #ffffff;
      --primary-color: #0f3460;
    }
    * { box-sizing: border-box; } /* Pour inclure le padding et la bordure dans la taille des éléments */
    body {
      margin: 0;
      font-family: "Poppins", sans-serif; /* Utilisation de la police Poppins */
      background: var(--background); /* Couleur de fond dynamique */
      color: var(--color); /* Couleur du texte dynamique */
    }
    a { text-decoration: none; color: var(--color); } /* Liens sans soulignement et couleur dynamique */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; /* Centre le contenu verticalement et horizontalement */
    }
    .login-container {
      position: relative;
      width: 22.2rem; /* Largeur fixe du bloc de connexion */
    }
    .form-container {
      border: 1px solid hsla(0, 0%, 65%, 0.158); /* Bordure légère */
      box-shadow: 0 0 36px 1px rgba(0, 0, 0, 0.2); /* Ombre portée */
      border-radius: 10px; /* Bords arrondis */
      backdrop-filter: blur(20px); /* Effet de flou en arrière-plan */
      z-index: 99;
      padding: 2rem; /* Espacement interne */
    }
    .login-container form input {
      display: block;
      padding: 14.5px;
      width: 100%;
      margin: 1rem 0;
      background-color: #9191911f; /* Fond légèrement transparent */
      border: none;
      border-radius: 5px;
      color: var(--color);
    }
    .login-container form button {
      background-color: var(--primary-color);
      color: var(--color);
      padding: 13px;
      border-radius: 5px;
      font-size: 18px;
      width: 100%;
      cursor: pointer;
      margin-bottom: 1rem;
      border: none;
    }
    .circle {
      width: 8rem;
      height: 8rem;
      background: var(--primary-color);
      border-radius: 50%;
      position: absolute;
    }
    .illustration {
      position: absolute;
      top: -14%;
      right: -2px;
      width: 90%;
    }
    .circle-one { top: 0; left: 0; transform: translate(-45%, -45%); z-index: -1; }
    .circle-two { bottom: 0; right: 0; transform: translate(45%, 45%); z-index: -1; }
    .login-forget { display: flex; justify-content: space-between; font-size: 0.9rem; }
    .theme-btn-container { position: absolute; left: 0; bottom: 2rem; }
  </style>
</head>
<body>
  <section class="container">
    <div class="login-container">
      <!-- Cercle décoratif en haut à gauche -->
      <div class="circle circle-one"></div>
      <div class="form-container">
        <!-- Illustration décorative -->
        <img src="https://raw.githubusercontent.com/hicodersofficial/glassmorphism-login-form/master/assets/illustration.png" class="illustration" style="pointer-events: none;" />
        <h1 class="text-center mb-4">LOGIN</h1>
        <!-- Formulaire de connexion -->
        <form id="loginForm">
          <input type="email" id="email" placeholder="Email" required />
          <input type="password" id="password" placeholder="Password" required />
          <button type="submit">SUBMIT</button>
        </form>
        <!-- Lien pour rester sur la page de login (peut servir à ajouter d'autres liens plus tard) -->
        <div class="login-forget">
          <a href="index.html">LOGIN</a>
        </div>
      </div>
      <!-- Cercle décoratif en bas à droite -->
      <div class="circle circle-two"></div>
    </div>
    <!-- Conteneur pour les boutons de changement de thème -->
    <div class="theme-btn-container"></div>
  </section>
  <script>
    // Tableau des thèmes disponibles pour l'interface
    const themes = [
      { background: "#1A1A2E", color: "#FFFFFF", primaryColor: "#0F3460" },
      { background: "#461220", color: "#FFFFFF", primaryColor: "#E94560" },
      { background: "#192A51", color: "#FFFFFF", primaryColor: "#967AA1" },
      { background: "#F7B267", color: "#000000", primaryColor: "#F4845F" },
      { background: "#F25F5C", color: "#000000", primaryColor: "#642B36" },
      { background: "#231F20", color: "#FFF", primaryColor: "#BB4430" }
    ];

    // Fonction pour appliquer un thème sélectionné
    const setTheme = (theme) => {
      const root = document.querySelector(":root");
      root.style.setProperty("--background", theme.background);
      root.style.setProperty("--color", theme.color);
      root.style.setProperty("--primary-color", theme.primaryColor);
    };

    // Fonction pour afficher les boutons de sélection de thème
    const displayThemeButtons = () => {
      const btnContainer = document.querySelector(".theme-btn-container");
      themes.forEach((theme) => {
        const div = document.createElement("div");
        div.className = "theme-btn";
        div.style.cssText = `background: ${theme.background}; width: 25px; height: 25px`;
        btnContainer.appendChild(div);
        // Ajoute un écouteur d'événement pour changer le thème au clic
        div.addEventListener("click", () => setTheme(theme));
      });
    };
    displayThemeButtons(); // Affiche les boutons de thème au chargement

    // Gestion de la soumission du formulaire de connexion
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault(); // Empêche le rechargement de la page par défaut
      console.log("Formulaire soumis"); // Vérifie que l'événement est bien capturé

      // Récupère les valeurs saisies par l'utilisateur
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Envoie une requête POST à l'API backend pour vérifier les identifiants
      const res = await fetch('http://localhost:3000/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      // Récupère la réponse du serveur (message et éventuellement infos utilisateur)
      const data = await res.json();
      alert(data.message); // Affiche le message de retour (succès ou erreur)

      // Si la connexion est réussie, redirige vers la page users.html
      if (res.ok) window.location.href = 'users.html';
    });
  </script>
</body>
</html>
