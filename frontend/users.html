<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Utilisateurs</title>
  <!-- Importation de la police Poppins depuis Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <!-- Importation de Bootstrap pour le style des tableaux et boutons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Importation de DataTables pour la gestion avancée du tableau -->
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet"/>
  <style>
    :root {
      --background: #1a1a2e;
      --color: #ffffff;
      --primary-color: #0f3460;
    }
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif; /* Utilisation de la police Poppins */
      background: var(--background);      /* Couleur de fond dynamique */
      color: var(--color);                /* Couleur du texte dynamique */
    }
    .container-glass {
      max-width: 1000px;
      margin: 5% auto;
      background: rgba(255, 255, 255, 0.07); /* Effet glassmorphism */
      padding: 2rem;
      border-radius: 20px;
      backdrop-filter: blur(20px);           /* Flou d'arrière-plan */
      box-shadow: 0 0 20px rgba(0,0,0,0.3);  /* Ombre portée */
    }
    th, td {
      color: #000 !important; /* Force la couleur du texte dans le tableau en noir */
    }
    .title {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2rem;
    }
  </style>
</head>
<body>
  <div class="container-glass">
    <h2 class="title">Liste des utilisateurs</h2>
    <!-- Tableau qui affichera la liste des utilisateurs -->
    <table id="usersTable" class="table table-hover table-bordered text-dark">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody></tbody> <!-- Les lignes seront ajoutées dynamiquement en JS -->
    </table>
  </div>

  <div class="login-forget" style="text-align: center; padding-top: 150px;">
      <a href="register.html"><button type="submit">s'inscrire</button></a>
  </div>

  <!-- Importation de jQuery (nécessaire pour DataTables) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Importation de DataTables et de son adaptation Bootstrap -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script>
    // Récupère la liste des utilisateurs depuis l'API backend
    fetch('http://localhost:3000/users')
      .then(res => res.json()) // Transforme la réponse en JSON
      .then(users => {
        const tbody = document.querySelector('#usersTable tbody');
        // Pour chaque utilisateur, crée une ligne dans le tableau
        users.forEach(user => {
          const row = `<tr><td>${user.id}</td><td>${user.name}</td><td>${user.email}</td></tr>`;
          tbody.innerHTML += row;
        });
        // Initialise DataTables pour ajouter la recherche, le tri, la pagination, etc.
        $('#usersTable').DataTable();
      });
  </script>
</body>
</html>
