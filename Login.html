<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification</title>
    <link href="assets/CSS/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1515378791036-0648a3ef77b2?auto=format&fit=crop&w=1500&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: rgba(255, 255, 255, 0.88);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.25);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            margin-top: 40px;
        }
        .card-title {
            font-size: 2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .btn-success {
            font-weight: bold;
        }
        input.form-control {
            border-radius: 10px;
            padding: 10px;
            font-size: 1.1rem;
        }
        .nav-link.text-primary {
            font-weight: 500;
            font-size: 1.05rem;
        }
    </style>
</head>

<body>
    <form onsubmit="register(event)">
        <div class="card col-11 col-sm-6 position-absolute top-50 start-50 translate-middle shadow">
            <h5 class="card-title text-center mt-3">Créer un compte</h5>
            <div class="card-body">
                <div class="form-group mb-2">
                    <input class="form-control" id="name" type="text" placeholder="Nom" required>
                </div>
                <div class="form-group mb-2">
                    <input class="form-control" id="email" type="email" placeholder="Email" required>
                </div>
                <div class="form-group mb-2">
                    <input class="form-control" id="password" type="password" placeholder="Mot de passe" required>
                </div>
            </div>
            <div class="d-grid gap-2 col-3 mx-auto">
                <button class="btn btn-success" type="submit">S'inscrire</button>
            </div>
            <div class="text-xl-center m-3">
                <a class="nav-link text-primary" href="auth.html">Vous avez déjà un compte ?</a>
            </div>
        </div>
    </form>
    <script src="assets/JS/app.js"></script>
</body>
</html>
