<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inscription</title>
  <!-- Bootstrap -->
  <link href="assets/CSS/Bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      background-image: url('https://images.unsplash.com/photo-1515378791036-0648a3ef77b2?auto=format&fit=crop&w=1500&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.25);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      margin-top: 40px;
      padding: 30px 25px;
    }

    .card-title {
      font-size: 2rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 25px;
    }

    .form-control {
      border-radius: 12px;
      padding: 12px 15px;
      font-size: 1rem;
      box-shadow: none;
      transition: border-color 0.3s ease;
    }

    .form-control:focus {
      border-color: #28a745;
      box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
    }

    .input-group-text {
      background: #e9f5ed;
      border-radius: 10px 0 0 10px;
      border-right: none;
    }

    .btn-success {
      font-weight: bold;
      font-size: 1.1rem;
      padding: 10px 0;
      border-radius: 12px;
    }

    .nav-link.text-primary {
      font-weight: 500;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <!-- Formulaire d'inscription -->
  <form onsubmit="register(event)">
    <div class="card col-11 col-sm-6 position-absolute top-50 start-50 translate-middle shadow">
      <h5 class="card-title text-center">Créer un compte</h5>
      <div class="card-body">
        <!-- Nom -->
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="fas fa-user"></i></span>
          <input class="form-control" id="name" type="text" placeholder="Nom" required />
        </div>
        <!-- Email -->
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          <input class="form-control" id="email" type="email" placeholder="Email" required />
        </div>
        <!-- Mot de passe -->
        <div class="input-group mb-4">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input class="form-control" id="password" type="password" placeholder="Mot de passe" required />
        </div>
        <!-- Bouton -->
        <div class="d-grid gap-2">
          <button class="btn btn-success" type="submit">S'inscrire</button>
        </div>
        <!-- Lien -->
        <div class="text-center mt-3">
          <a class="nav-link text-primary" href="auth.html">Vous avez déjà un compte ?</a>
        </div>
      </div>
    </div>
  </form>

  <!-- JS -->
  <script src="assets/JS/app.js"></script>
</body>
</html>
