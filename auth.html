<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion</title>
  <link href="assets/CSS/Bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
        url('https://images.unsplash.com/photo-1506765515384-028b60a970df?auto=format&fit=crop&w=1500&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 420px;
      width: 100%;
      animation: fadeIn 0.8s ease-in-out;
    }

    .logo {
      display: block;
      margin: 0 auto 20px;
      width: 80px;
    }

    .card-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 30px;
    }

    .input-group-text {
      background-color: #f1f1f1;
      border: none;
    }

    .form-control {
      border-left: none;
      font-size: 1rem;
      border-radius: 0 8px 8px 0;
    }

    .input-group {
      border: 1px solid #ced4da;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .btn-primary, .btn-success {
      font-weight: bold;
      font-size: 1.1rem;
      padding: 10px;
      border-radius: 10px;
      transition: 0.2s;
    }

    .btn-primary:hover, .btn-success:hover {
      transform: translateY(-2px);
    }

    .forgot-link {
      text-align: right;
      font-size: 0.9rem;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    .forgot-link a {
      color: #007bff;
      text-decoration: none;
    }

    .forgot-link a:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <form onsubmit="login(event)">
    <div class="card">
      <!-- Logo optionnel -->
      <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" class="logo" alt="Logo">
      <p class="card-title">Connexion à votre compte</p>

      <!-- Champ Email -->
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
        <input type="email" class="form-control" id="email" placeholder="Adresse e-mail" required>
      </div>

      <!-- Champ Mot de passe -->
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-lock"></i></span>
        <input type="password" class="form-control" id="password" placeholder="Mot de passe" required>
      </div>

      <!-- Lien oublié -->
      <div class="forgot-link">
        <a href="#">Mot de passe oublié ?</a>
      </div>

      <!-- Bouton connexion -->
      <div class="d-grid gap-2 mb-3">
        <button class="btn btn-primary" type="submit">Se connecter</button>
      </div>

      <!-- Bouton création de compte -->
      <div class="d-grid gap-2">
        <button class="btn btn-success" type="button" onclick="goToPage()">Créer un nouveau compte</button>
      </div>
    </div>
  </form>
  <script src="assets/JS/app.js"></script>
</body>
</html>
