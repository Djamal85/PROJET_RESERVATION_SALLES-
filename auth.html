<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link href="assets/CSS/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1500&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            margin-top: 40px;
        }
        .card-title {
            font-size: 2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .btn-primary {
            background: #007bff;
            border: none;
            font-weight: bold;
        }
        .btn-success {
            font-weight: bold;
        }
        input.form-control {
            border-radius: 10px;
            padding: 10px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <form onsubmit="login(event)">
        <div class="card col-11 col-sm-5 position-absolute top-50 start-50 translate-middle shadow">
            <div class="card-body">
                <p class="card-title text-center">Se connecter</p>
                <div class="form-group mb-2">
                    <input class="form-control" id="email" type="email" placeholder="Email" required>
                </div>
                <div class="form-group mb-2">
                    <input class="form-control" id="password" type="password" placeholder="Mot de passe" required>
                </div>
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" type="submit">Se connecter</button>
                </div>
            </div>
            <hr class="sidebar-divider">
            <div class="d-grid gap-2 col-6 mx-auto mb-2">    
                <button class="btn btn-success" type="button" onclick="goToPage()">Créer un nouveau compte</button>
            </div>
        </div>
    </form>
    <script src="assets/JS/app.js"></script>
</body>
</html>
