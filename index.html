<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - Utilisateurs</title>

  <!-- Bootstrap + DataTables -->
  <link href="assets/CSS/Bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0,0,0,0.6)), 
        url('https://images.unsplash.com/photo-1464983953574-0892a716854b?auto=format&fit=crop&w=1500&q=80') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 18px;
      padding: 40px 30px;
      margin: 50px auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      max-width: 1000px;
    }

    h1, h2 {
      font-weight: bold;
      text-align: center;
      color: #2c3e50;
    }

    .btn-success {
      font-weight: bold;
      float: right;
    }

    .table-container {
      margin-top: 30px;
    }

    .dataTables_wrapper .dataTables_filter input {
      border-radius: 10px;
      padding: 5px 10px;
      border: 1px solid #ced4da;
    }

    .table thead th {
      background: linear-gradient(to right, #007bff, #0056b3);
      color: #fff;
      border: none;
      font-size: 1rem;
    }

    .table tbody tr:hover {
      background-color: #d0e7ff !important;
    }

    .table td, .table th {
      text-align: center;
      vertical-align: middle;
    }

    @media (max-width: 768px) {
      .btn-success {
        float: none;
        display: block;
        width: 100%;
        margin-top: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="mb-0">Bienvenue</h1>
      <button class="btn btn-success" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Déconnexion</button>
    </div>

    <h2>Liste des utilisateurs</h2>
    <div class="table-container mt-4">
      <table class="table table-striped table-bordered" id="usersTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Email</th>
          </tr>
        </thead>
        <tbody>
          <!-- Contenu généré dynamiquement -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- JS: Auth, jQuery, DataTables -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const token = localStorage.getItem('authToken');
      if (!token) {
        window.location.href = 'auth.html';
      }
    });

    function logout() {
      localStorage.removeItem('authToken');
      window.location.reload();
    }
  </script>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    $(document).ready(function () {
      fetch('http://localhost:3000/users')
        .then(response => response.json())
        .then(users => {
          let rows = '';
          users.forEach(user => {
            rows += `
              <tr>
                <td>${user.id}</td>
                <td>${user.name || 'N/A'}</td>
                <td>${user.email}</td>
              </tr>`;
          });
          $('#usersTable tbody').html(rows);
          $('#usersTable').DataTable({
            language: {
              url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/fr-FR.json'
            }
          });
        })
        .catch(error => console.error('Erreur de chargement :', error));
    });
  </script>
</body>
</html>
