<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link href="assets/CSS/Bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1464983953574-0892a716854b?auto=format&fit=crop&w=1500&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            background: rgba(255,255,255,0.92);
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(31,38,135,0.18);
            padding: 30px 25px;
            margin-bottom: 30px;
        }
        h1, h2 {
            color: #2c3e50;
            font-weight: bold;
        }
        .btn-success {
            font-weight: bold;
        }
        /* Tableau amélioré */
        table {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(44,62,80,0.10);
        }
        .table thead th {
            background: linear-gradient(90deg, #007bff 60%, #0056b3 100%);
            color: #fff;
            border: none;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }
        .table-striped>tbody>tr:nth-of-type(odd) {
            background-color: #f4f8fb;
        }
        .table-striped>tbody>tr:nth-of-type(even) {
            background-color: #e9f1fa;
        }
        .table-bordered th, .table-bordered td {
            border: 1px solid #dee2e6;
        }
        .table tbody tr:hover {
            background-color: #d0e7ff !important;
            transition: background 0.2s;
        }
        .table td, .table th {
            vertical-align: middle;
            text-align: center;
        }
    </style>
</head>
<body>

  <div class="container mt-5 align-content-center">
    <h1 class="text-center">Bienvenue</h1>
    <button class="btn btn-success" onclick="logout()">Déconnecter</button>
  </div>

  <!-- //afficher les utilisateurs -->
  <div class="container mt-4">
    <h2 class="text-center">Liste des utilisateurs</h2>
    <table class="table table-striped table-bordered" id="usersTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            <!-- Les données seront insérées ici -->
        </tbody>
    </table>
  </div>

  <script>
    // Vérification du token à l'ouverture de la page
    document.addEventListener('DOMContentLoaded', function() {
      const token = localStorage.getItem('authToken');
      if (!token) {
        window.location.href = 'auth.html';
      }
    });
    function logout() {
      localStorage.removeItem('authToken');
      window.location.reload();
    }
  </script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    $(document).ready(function () {
        fetch('http://localhost:3000/users')
            .then(response => response.json())
            .then(users => {
                let rows = '';
                users.forEach(user => {
                    rows += `<tr>
                                <td>${user.id}</td>
                                <td>${user.name || 'N/A'}</td>
                                <td>${user.email}</td>
                             </tr>`;
                });
                $('#usersTable tbody').html(rows);
                $('#usersTable').DataTable();
            })
            .catch(error => console.error('Erreur de chargement:', error));
    });
  </script>
</body>
</html>
